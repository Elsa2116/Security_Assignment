services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secureflow
      POSTGRES_USER: secureflow
      POSTGRES_PASSWORD: secureflow_dev_password
    ports:
      - "5433:5432"
    volumes:
      - secureflow-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureflow -d secureflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://secureflow:secureflow_dev_password@postgres:5432/secureflow
      JWT_ACCESS_SECRET: replace-with-at-least-32-random-characters
      BETTER_AUTH_SECRET: replace-with-at-least-32-random-characters
      BETTER_AUTH_URL: http://localhost:3000
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_SECONDS: 2592000
      BACKUP_ENCRYPTION_KEY: replace-with-32-byte-base64-key
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "node dist/scripts/migrate.js && npx auth@latest migrate && npm run start"]

volumes:
  secureflow-postgres:
