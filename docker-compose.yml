services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secureflow
      POSTGRES_USER: secureflow
      POSTGRES_PASSWORD: secureflow_dev_password
    ports:
      - "5433:5432"
    volumes:
      - secureflow-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureflow -d secureflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://secureflow:secureflow_dev_password@postgres:5432/secureflow
      JWT_ACCESS_SECRET: replace-with-at-least-32-random-characters
      BETTER_AUTH_SECRET: replace-with-at-least-32-random-characters
      BETTER_AUTH_URL: http://localhost:3000
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_SECONDS: 2592000
      BACKUP_ENCRYPTION_KEY: development-only-backup-key-please-change-1234
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-SecureFlow <no-reply@secureflow.local>}
      HIBP_PASSWORD_CHECK: ${HIBP_PASSWORD_CHECK:-false}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-}
      OBJECT_STORAGE_RETENTION_DAYS: ${OBJECT_STORAGE_RETENTION_DAYS:-30}
    ports:
      - "3000:3000"
    # Persist encrypted backup files on the host for local verification and restore drills.
    volumes:
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      # Local development creates only organization/departments metadata; it never creates passwords or tokens.
    command: ["sh", "-c", "node dist/scripts/migrate.js && node dist/scripts/seed-demo.js && npm run start"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - secureflow-redis:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: secureflow
      MINIO_ROOT_PASSWORD: secureflow_minio_password
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - secureflow-minio:/data

  worker:
    build: .
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://secureflow:secureflow_dev_password@postgres:5432/secureflow
      JWT_ACCESS_SECRET: replace-with-at-least-32-random-characters
      BETTER_AUTH_SECRET: replace-with-at-least-32-random-characters
      BETTER_AUTH_URL: http://localhost:3000
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_SECONDS: 2592000
      BACKUP_ENCRYPTION_KEY: development-only-backup-key-please-change-1234
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-SecureFlow <no-reply@secureflow.local>}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["node", "dist/src/workers/index.js"]

  # Optional local scheduler; start with `docker compose --profile backup up -d backup`.
  backup:
    build: .
    profiles: ["backup"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://secureflow:secureflow_dev_password@postgres:5432/secureflow
      JWT_ACCESS_SECRET: replace-with-at-least-32-random-characters
      BETTER_AUTH_SECRET: replace-with-at-least-32-random-characters
      BETTER_AUTH_URL: http://localhost:3000
      BACKUP_ENCRYPTION_KEY: development-only-backup-key-please-change-1234
      BACKUP_DIR: /app/backups
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-}
      OBJECT_STORAGE_RETENTION_DAYS: ${OBJECT_STORAGE_RETENTION_DAYS:-30}
    volumes:
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "while true; do node dist/scripts/backup-full.js || true; sleep 86400; done"]

volumes:
  secureflow-postgres:
  secureflow-redis:
  secureflow-minio:
