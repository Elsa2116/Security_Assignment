name: Security checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm install resolves optional peer packages used by the current Vitest toolchain on Linux runners.
        run: npm install --ignore-scripts

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Semgrep scan
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
